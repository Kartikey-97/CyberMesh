version: '3.8'

services:
  user-service:
    build: ./services/user-service
    ports:
      - "8001:8001"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=user-service-secret
    networks:
      - cybermesh-net

  billing-service:
    build: ./services/billing-service
    ports:
      - "8002:8002"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=billing-service-secret
    networks:
      - cybermesh-net

  order-service:
    build: ./services/order-service
    ports:
      - "8003:8003"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=order-service-secret
    networks:
      - cybermesh-net

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8004:8004"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=inventory-service-secret
    networks:
      - cybermesh-net

  notification-service:
    build: ./services/notification-service
    ports:
      - "8005:8005"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=notification-service-secret
    networks:
      - cybermesh-net

  auth-service:
    build: ./services/auth-service
    ports:
      - "8006:8006"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=auth-service-secret
    networks:
      - cybermesh-net

  shipping-service:
    build: ./services/shipping-service
    ports:
      - "8007:8007"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=shipping-service-secret
    networks:
      - cybermesh-net

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "8008:8008"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=analytics-service-secret
    networks:
      - cybermesh-net

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "8009:8009"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=recommendation-service-secret
    networks:
      - cybermesh-net

  search-service:
    build: ./services/search-service
    ports:
      - "8010:8010"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=search-service-secret
    networks:
      - cybermesh-net

networks:
  cybermesh-net:
    driver: bridge
