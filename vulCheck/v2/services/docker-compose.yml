version: '3.8'

services:
  user-service:
    build: ./services/user-service
    ports:
      - "8001:8001"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=user-service-secret
    networks:
      - cybermesh-net

  billing-service:
    build: ./services/billing-service
    ports:
      - "8002:8002"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=billing-service-secret
    networks:
      - cybermesh-net

  order-service:
    build: ./services/order-service
    ports:
      - "8003:8003"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=order-service-secret
    networks:
      - cybermesh-net

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8004:8004"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=inventory-service-secret
    networks:
      - cybermesh-net

  notification-service:
    build: ./services/notification-service
    ports:
      - "8005:8005"
    environment:
      - PROXY_URL=http://proxy:8080
      - SERVICE_SECRET=notification-service-secret
    networks:
      - cybermesh-net

networks:
  cybermesh-net:
    driver: bridge
